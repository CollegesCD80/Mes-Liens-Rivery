<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Éducatif Élèves</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        quest: {
                            blue: '#1D4ED8', purple: '#0F766E', cyan: '#EA7B52',
                            dark: '#F6F7F9', panel: 'rgba(255, 255, 255, 0.88)', card: 'rgba(255, 255, 255, 0.92)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F6F7F9;
            background-image: 
                radial-gradient(at 15% 15%, rgba(29, 78, 216, 0.08) 0px, transparent 55%),
                radial-gradient(at 85% 20%, rgba(15, 118, 110, 0.08) 0px, transparent 55%),
                radial-gradient(at 50% 88%, rgba(234, 123, 82, 0.07) 0px, transparent 55%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #1E293B;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(15, 118, 110, 0.14);
            box-shadow: 0 8px 30px -10px rgba(15, 23, 42, 0.08);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(29, 78, 216, 0.12);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            outline: none;
        }
        .glass-card:hover {
            background: #FFFFFF;
            border-color: #EA7B52;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 28px -6px rgba(234, 123, 82, 0.25);
        }
        .vr-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .vr-btn:active { transform: scale(0.95); }

        /* Style des boutons de catégories sans dégradé et sans ombre */
        .category-btn {
            background-color: #FFFFFF;
            border: 1px solid rgba(15, 118, 110, 0.2);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .category-btn:hover {
            background-color: #FFF7F4;
            border-color: #EA7B52;
            color: #C25934;
        }
        .category-btn.active {
            background-color: #EA7B52;
            border-color: #C25934;
            color: #FFFFFF;
            font-weight: 800;
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-800 min-h-screen flex flex-col pb-12 select-none">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-200 px-4 lg:px-8 py-3.5 mb-6">
        <div class="max-w-[95rem] mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3.5 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-3.5">
                    <div class="w-12 h-12 rounded-2xl bg-[#1D4ED8] flex items-center justify-center shadow-sm text-white text-2xl font-black shrink-0 border border-[#0F766E]/30">
                        <i class="fa-solid fa-vr-cardboard"></i>
                    </div>
                    <div>
                        <h1 class="text-lg md:text-xl font-extrabold tracking-wide text-[#1D4ED8]">
                            Espace Ressources élèves
                        </h1>
                        <p class="text-sm text-[#0F766E] font-semibold tracking-wide flex items-center gap-1.5 mt-0.5">
                            <i class="fa-solid fa-school text-[#EA7B52]"></i>
                            <span>Collège Jules Verne - Rivery</span>
                        </p>
                    </div>
                </div>
                <div id="vr-clock-mobile" class="text-xs font-mono bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl text-[#0F766E] font-semibold md:hidden flex items-center gap-1.5 min-w-[110px] justify-center">
                    <i class="fa-regular fa-clock text-[#EA7B52]"></i>
                    <span class="clock-text">--:--:--</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full md:w-96">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-lg">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Rechercher une ressource..." class="w-full pl-12 pr-10 py-3 rounded-2xl bg-white border border-slate-300 text-slate-800 placeholder-slate-400 text-base focus:outline-none focus:border-[#0F766E]">
                <button id="clearSearch" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-700">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <div id="vr-clock-desktop" class="hidden md:flex text-xs font-mono bg-slate-100 border border-slate-200 px-3.5 py-2.5 rounded-xl text-[#0F766E] font-semibold items-center gap-2 min-w-[125px] justify-center">
                    <i class="fa-regular fa-clock text-[#EA7B52]"></i>
                    <span class="clock-text">--:--:--</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-[95rem] mx-auto px-4 lg:px-8 flex-1 w-full flex flex-col">
        <!-- BARRE HORIZONTALE DES CATÉGORIES -->
        <section class="mb-8 overflow-x-auto pb-2">
            <div class="flex items-center gap-2 min-w-max" id="categoryFilterContainer"></div>
        </section>

        <!-- BOOKMARKS GRID -->
        <section class="flex-1">
            <div id="bookmarkGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4 justify-items-center"></div>
            <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center glass-panel rounded-3xl mt-4">
                <h3 class="text-xl font-bold text-slate-800 mb-1">Aucune ressource trouvée</h3>
                <button id="btnResetFilters" class="vr-btn mt-4 px-5 py-2.5 bg-[#EA7B52] text-white border border-[#C25934] rounded-xl text-sm font-semibold">
                    Réinitialiser les filtres
                </button>
            </div>
        </section>
    </main>

    <!-- SCRIPT APPLICATION -->
    <script>
        const DEFAULT_CATEGORIES = ['Toutes', 'Sciences & Espace', 'Histoire & Musées', 'SVT & Anatomie', 'WebXR & Démo', 'Vidéos 360°'];
        const DEFAULT_BOOKMARKS = [
            { id: '1', title: 'NASA Solar System Treks', url: 'https://trek.nasa.gov', category: 'Sciences & Espace', icon: '🚀', description: 'Exploration interactive 3D des surfaces de la Lune, de Mars et du système solaire.' },
            { id: '2', title: 'Musée du Louvre VR', url: 'https://www.louvre.fr', category: 'Histoire & Musées', icon: '🏛️', description: 'Visites virtuelles immersives des galeries et expositions du musée.' }
        ];

        const binId = "6afdbe47ffd5d16053cbaf1e";
        const readOnlyApiKey = "$2a$10$OdIm7EgO7Jnf3IUg8ukCuOIEkffYw7SErKxywlrM88lko/uP7ZtZ2";

        let categories = [];
        let bookmarks = [];
        
        let currentCategory = 'Toutes';
        let searchQuery = '';

        const bookmarkGrid = document.getElementById('bookmarkGrid');
        const emptyState = document.getElementById('emptyState');
        const categoryFilterContainer = document.getElementById('categoryFilterContainer');
        const searchInput = document.getElementById('searchInput');

        window.addEventListener('DOMContentLoaded', async () => {
            await loadData();
            initClock();
            renderCategories();
            renderBookmarks();
            setupEventListeners();
        });

        function initClock() {
            function updateClock() {
                const now = new Date();
                document.querySelectorAll('.clock-text').forEach(el => {
                    el.textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                });
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        async function loadData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Access-Key': readOnlyApiKey }
                });
                if (response.ok) {
                    const json = await response.json();
                    categories = json.record.categories || DEFAULT_CATEGORIES;
                    bookmarks = json.record.bookmarks || DEFAULT_BOOKMARKS;
                    return;
                }
            } catch (e) { console.error("Erreur de chargement Cloud", e); }

            categories = [...DEFAULT_CATEGORIES];
            bookmarks = [...DEFAULT_BOOKMARKS];
        }

        function renderCategories() {
            categoryFilterContainer.innerHTML = '';
            
            if (!categories.includes('Toutes')) categories.unshift('Toutes');
            const otherCategories = categories.filter(c => c !== 'Toutes').sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
            const sortedCategories = ['Toutes', ...otherCategories];

            if (!sortedCategories.includes(currentCategory)) {
                currentCategory = 'Toutes';
            }

            sortedCategories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = (cat === currentCategory);
                btn.className = `vr-btn px-5 py-2.5 rounded-2xl text-xs font-bold transition-all category-btn ${isActive ? 'active' : 'text-slate-700'}`;
                btn.innerHTML = `<span>${escapeHTML(cat)}</span>`;
                btn.addEventListener('click', () => {
                    currentCategory = cat;
                    renderCategories();
                    renderBookmarks();
                });
                categoryFilterContainer.appendChild(btn);
            });
        }

        function renderBookmarks() {
            bookmarkGrid.innerHTML = '';
            const filtered = bookmarks.filter(item => {
                const matchesCategory = currentCategory === 'Toutes' || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || item.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            emptyState.classList.toggle('hidden', filtered.length > 0);
            emptyState.classList.toggle('flex', filtered.length === 0);

            filtered.forEach(item => {
                const card = document.createElement('a');
                card.href = item.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.className = 'glass-card rounded-3xl p-4 relative w-full';
                
                let iconHTML = `<span class="text-2xl">${item.icon || '🌐'}</span>`;
                if (item.icon && item.icon.startsWith('fa-')) iconHTML = `<i class="fa-brands ${item.icon} text-2xl text-[#1D4ED8]"></i>`;

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <div class="w-11 h-11 rounded-2xl bg-[#0F766E]/10 border border-[#0F766E]/20 flex items-center justify-center shrink-0">${iconHTML}</div>
                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-xl bg-[#1D4ED8]/10 border border-[#1D4ED8]/20 text-[#1D4ED8] line-clamp-2 leading-tight text-right">${escapeHTML(item.category)}</span>
                        </div>
                        <h3 class="text-sm font-bold text-slate-900 text-center mb-1.5 line-clamp-2 leading-snug min-h-[2.5rem]" title="${escapeHTML(item.title)}">${escapeHTML(item.title)}</h3>
                        <p class="text-slate-600 text-[11px] text-center leading-relaxed line-clamp-2 mb-2">${escapeHTML(item.description || '')}</p>
                    </div>
                `;
                bookmarkGrid.appendChild(card);
            });
        }

        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => { 
                searchQuery = e.target.value.trim(); 
                renderBookmarks(); 
            });
        }

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
    </script>
</body>
</html>
